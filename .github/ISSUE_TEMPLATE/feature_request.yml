name: Feature request
description: Propose a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: subject
    attributes:
      label: Subject
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions
      description: Ideas about how it could be implemented.
  - type: textarea
    id: other
    attributes:
      label: Other information
